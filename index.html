<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Discord Clone Mobile</title>
  <style>
    :root {
      --bg-darker: #111214;
      --bg-sidebar: #2b2d31;
      --bg-main: #313338;
      --blurple: #5865f2;
      --blurple-hover: #4752c4;
      --text-primary: #f2f3f5;
      --text-muted: #949ba4;
      --danger: #f23f43;
      --success: #23a55a;
      --input-bg: #1e1f22;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg-darker); color: var(--text-primary); height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    .hidden { display: none !important; }
    
    /* Login Screen */
    .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-main); padding: 20px; }
    .login-box { background: var(--bg-sidebar); padding: 30px 24px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); text-align: center; }
    .login-box h2 { margin-bottom: 6px; font-size: 24px; font-weight: 700; }
    .login-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .error-msg { background: var(--danger); padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; font-weight: 500; }
    
    label { display: block; text-align: left; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid transparent; border-radius: 6px; color: #fff; margin-bottom: 20px; font-size: 16px; transition: 0.2s; }
    input:focus { outline: none; border-color: var(--blurple); }
    
    button { width: 100%; padding: 14px; background: var(--blurple); border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--blurple-hover); }

    /* App Workspace */
    .app-container { display: flex; height: 100vh; width: 100vw; position: relative; overflow: hidden; }
    
    /* Top Navigation Header for Mobile */
    .mobile-header { display: none; background: var(--bg-sidebar); height: 48px; border-bottom: 1px solid rgba(0,0,0,0.2); align-items: center; padding: 0 16px; position: absolute; top: 0; left: 0; width: 100%; z-index: 5; }
    .menu-toggle { background: transparent; border: none; font-size: 24px; color: var(--text-primary); cursor: pointer; width: auto; padding: 0; }
    .mobile-header h2 { font-size: 16px; margin-left: 16px; font-weight: 600; }

    /* Sidebar / Navigation Drawer */
    .sidebar { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; justify-content: space-between; height: 100%; z-index: 8; transition: transform 0.3s ease; }
    .server-title { padding: 16px; font-size: 16px; font-weight: 700; border-bottom: 1px solid rgba(0,0,0,0.2); }
    .channel { padding: 12px; margin: 8px; background: rgba(255,255,255,0.06); border-radius: 6px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
    
    /* User Profile Footer */
    .user-footer { background: #232428; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .user-tag { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; min-width: 0; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #555; flex-shrink: 0; }
    .user-details { display: flex; flex-direction: column; font-size: 13px; min-width: 0; }
    .user-details span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { font-size: 11px; color: var(--success); font-weight: 400; }
    
    .footer-controls { display: flex; gap: 6px; }
    .control-btn { background: transparent; border: none; font-size: 20px; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
    .control-btn:hover { background: rgba(255,255,255,0.05); }
    .control-btn.muted { color: var(--danger); filter: drop-shadow(0 0 2px var(--danger)); }

    /* Main Content Area */
    .main { flex: 1; background: var(--bg-main); padding: 24px; display: flex; flex-direction: column; overflow-y: auto; height: 100%; }
    .main h1 { font-size: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; margin-bottom: 20px; font-weight: 600; }
    
    /* Users Grid Layout */
    .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 150px)); gap: 16px; }
    .user-card { background: var(--bg-darker); padding: 16px 12px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .user-card .avatar { width: 64px; height: 64px; border: 2px solid var(--success); }
    .user-card span { font-size: 14px; font-weight: 500; text-overflow: ellipsis; overflow: hidden; width: 100%; white-space: nowrap; }

    /* Settings Side Panel / Bottom Sheet on Mobile */
    .settings-panel { position: absolute; right: 0; top: 0; width: 320px; height: 100%; background: var(--bg-sidebar); border-left: 1px solid rgba(0,0,0,0.2); padding: 24px; box-shadow: -8px 0 24px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 24px; z-index: 12; transition: transform 0.3s ease; }
    .settings-header { display: flex; justify-content: space-between; align-items: center; }
    .settings-header h3 { font-size: 18px; font-weight: 700; }
    .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 28px; cursor: pointer; line-height: 1; }
    .close-btn:hover { color: #fff; }
    .upload-btn { background: #4e5058; margin-bottom: 16px; }
    .upload-btn:hover { background: #6d6f78; }

    /* Overlay Backdrop for Mobile Menu and Settings */
    .backdrop { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 6; }

    @media (max-width: 768px) {
      .mobile-header { display: flex; }
      .main { padding: 72px 16px 20px 16px; }
      .sidebar { position: absolute; left: 0; top: 0; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .settings-panel { width: 100%; max-width: 320px; transform: translateX(100%); }
      .settings-panel.open { transform: translateX(0); }
      .backdrop.show { display: block; }
      .users-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
  </style>
</head>
<body>

  <div id="login-screen" class="login-container">
    <div class="login-box">
      <h2>Boas-vindas de volta!</h2>
      <p>Estamos muito animados em te ver de novo!</p>
      <div id="login-error" class="error-msg hidden"></div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <label>NOME DE USUÁRIO</label>
        <input type="text" id="username" required autocomplete="off">
        <label>SENHA</label>
        <input type="password" id="password" required>
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <div id="app-screen" class="app-container hidden">
    <header class="mobile-header">
      <button class="menu-toggle" onclick="toggleSidebar(true)">☰</button>
      <h2># Sala de Voz Geral</h2>
    </header>

    <div id="backdrop" class="backdrop" onclick="closeAllPanels()"></div>

    <aside id="sidebar" class="sidebar">
      <div>
        <div class="server-title">Servidor de Testes</div>
        <div class="channel">🔊 Sala de Voz Global</div>
      </div>
      <div class="user-footer">
        <div class="user-tag" onclick="toggleSettings(true)">
          <img id="my-avatar" class="avatar" src="" alt="">
          <div class="user-details">
            <span id="my-username">Nome</span>
            <span class="status">Conectado 🟢</span>
          </div>
        </div>
        <div class="footer-controls">
          <button id="mute-btn" class="control-btn" onclick="toggleMute()" title="Desativar/Ativar Som">🎙️</button>
          <button class="control-btn" onclick="handleLogout()" title="Sair da Conta">🚪</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <h1 class="hidden-mobile"># Sala de Voz Geral</h1>
      <div id="users-list" class="users-grid"></div>
    </main>

    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <h3>Configurações</h3>
        <button class="close-btn" onclick="toggleSettings(false)">&times;</button>
      </div>
      <div>
        <label>ALTERAR SENHA</label>
        <input type="password" id="edit-password" placeholder="Digite a nova senha">
        <label>ALTERAR FOTO</label>
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="processAvatar(event)">
        <button class="upload-btn" onclick="document.getElementById('file-input').click()">Escolher Imagem</button>
        <button style="margin-top: 10px;" onclick="saveSettings()">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // URL DA SUA API / BACKEND
    const BACKEND_URL = "https://call-29og.onrender.com";

    // Conecta passando a URL explicitamente
    const socket = io(BACKEND_URL);
    
    let currentUser = null;
    let base64Avatar = "";
    let localStream = null;
    let isMuted = false;
    const peers = {};
    const iceCandidatesQueue = {};
    const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    window.onload = () => {
      const saved = localStorage.getItem('discord_session');
      if (saved) {
        const parsed = JSON.parse(saved);
        currentUser = parsed;
        socket.emit('login', { username: parsed.username, password: parsed.password });
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      currentUser = { username, password };
      socket.emit('login', { username, password });
    }

    socket.on('login-success', async (user) => {
      localStorage.setItem('discord_session', JSON.stringify(currentUser));
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('my-avatar').src = user.avatar;
      document.getElementById('my-username').innerText = user.username;
      
      document.getElementById('edit-password').value = currentUser.password;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        socket.emit('voice-ready');
      } catch (err) {
        console.warn("Permissão de microfone negada:", err.message);
      }
    });

    socket.on('login-error', (msg) => {
      const errDiv = document.getElementById('login-error');
      errDiv.innerText = msg;
      errDiv.classList.remove('hidden');
    });

    socket.on('update-users', (users) => {
      const listContainer = document.getElementById('users-list');
      listContainer.innerHTML = '';
      users.forEach(u => {
        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = '<img class="avatar" src="' + u.avatar + '" alt="">' +
                         '<span>' + u.username + '</span>';
        listContainer.appendChild(card);
      });
    });

    socket.on('password-updated-success', (data) => {
      if (currentUser) {
        currentUser.password = data.password;
        localStorage.setItem('discord_session', JSON.stringify(currentUser));
      }
      alert('Configurações salvas com sucesso!');
    });

    socket.on('peer-joined', async (data) => {
      if (data.id !== socket.id) {
        createPeerConnection(data.id, true);
      }
    });

    socket.on('webrtc-signal', async (data) => {
      const { from, signal } = data;
      if (from === socket.id) return;
      
      if (!peers[from]) {
        createPeerConnection(from, false);
      }
      
      const pc = peers[from];
      
      try {
        if (signal.sdp) {
          await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
          if (signal.sdp.type === 'offer') {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('webrtc-signal', { to: from, signal: { sdp: pc.localDescription } });
          }
          
          if (iceCandidatesQueue[from]) {
            for (const candidate of iceCandidatesQueue[from]) {
              await pc.addIceCandidate(new RTCIceCandidate(candidate));
            }
            delete iceCandidatesQueue[from];
          }
        } else if (signal.candidate) {
          if (!pc.remoteDescription) {
            if (!iceCandidatesQueue[from]) iceCandidatesQueue[from] = [];
            iceCandidatesQueue[from].push(signal.candidate);
          } else {
            await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
          }
        }
      } catch (error) {
        console.error("Erro no sinal WebRTC:", error);
      }
    });

    socket.on('peer-left', (data) => {
      if (peers[data.id]) {
        peers[data.id].close();
        delete peers[data.id];
      }
      const audioEl = document.getElementById('audio-' + data.id);
      if (audioEl) audioEl.remove();
    });

    function createPeerConnection(peerId, isInitiator) {
      const pc = new RTCPeerConnection(iceServers);
      peers[peerId] = pc;

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('webrtc-signal', { to: peerId, signal: { candidate: event.candidate } });
        }
      };

      pc.ontrack = (event) => {
        let audioEl = document.getElementById('audio-' + peerId);
        if (!audioEl) {
          audioEl = document.createElement('audio');
          audioEl.id = 'audio-' + peerId;
          audioEl.autoplay = true;
          document.body.appendChild(audioEl);
        }
        audioEl.srcObject = event.streams[0];
      };

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      if (isInitiator) {
        pc.onnegotiationneeded = async () => {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          socket.emit('webrtc-signal', { to: peerId, signal: { sdp: pc.localDescription } });
        };
      }
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;
      const muteBtn = document.getElementById('mute-btn');
      muteBtn.innerText = isMuted ? '
